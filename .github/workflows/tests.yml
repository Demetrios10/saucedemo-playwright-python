name: SauceDemo E2E
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python -m pytest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: saucedemo-evidencias
          path: |
            artifacts/
            evidencias/execucoes/
          retention-days: 7

